---
# Lux Bridge — unified Go binary (cmd/bridge).
#
# Replaces the legacy split of:
#   - bridge-server   (Express + Prisma Node API)
#   - bridge-ui       (Vite SPA on ghcr.io/hanzoai/spa)
# with a single image (ghcr.io/luxfi/bridge:<tag>) that embeds the SPA
# via go:embed and serves the /v1/bridge/* API natively.
#
# Assumes the lux-bridge namespace + bridge-secrets Secret already exist
# (created by k8s/mpc-deployment.yaml). Required secret keys:
#   - bridge-secrets.mpc-api-token   bearer token for the MPC daemon
# Optional secret keys (referenced only if you uncomment the env entry):
#   - bridge-secrets.bchain-rpc-url  BridgeVM JSON-RPC base URL
#
# Apply:
#   kubectl apply -f k8s/bridge-deployment.yaml
#
# The MPC StatefulSet + Service from k8s/mpc-deployment.yaml must already
# be running — this deployment talks to mpc-api-svc.lux-bridge.svc:8081.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lux-bridge-config
  namespace: lux-bridge
data:
  networks.yaml: |
    # Source of truth for the SPA + API's supported chains + tokens.
    # Edit this ConfigMap and roll the deployment to add/remove networks
    # without rebuilding the image.
    #
    # Internal names use the uppercase-with-underscore convention the
    # bridge's internal lookup tables (internal/mchain,
    # internal/depositcheck, internal/broadcast, internal/txassembler,
    # internal/tokens) key off. Don't switch to lowercase-dashed — the
    # chain wouldn't route.
    brand:
      name: Lux Bridge
      title: Lux Bridge
      logoUrl: /logo.svg
      iconUrl: /icon.svg
      brandHost: bridge.lux.network

    networks:
      - internalName: LUX_MAINNET
        displayName: Lux
        nativeCurrency: LUX
        chainId: "96369"
        type: evm
        isFeatured: true
        avgCompletion: 1m
        txExplorerTpl: https://explore.lux.network/tx/{tx}
        addrExplorerTpl: https://explore.lux.network/address/{addr}

      - internalName: ETHEREUM_MAINNET
        displayName: Ethereum
        nativeCurrency: ETH
        chainId: "1"
        type: evm
        isFeatured: true
        avgCompletion: 5m
        txExplorerTpl: https://etherscan.io/tx/{tx}
        addrExplorerTpl: https://etherscan.io/address/{addr}

      - internalName: ARBITRUM_MAINNET
        displayName: Arbitrum
        nativeCurrency: ETH
        chainId: "42161"
        type: evm
        avgCompletion: 2m
        txExplorerTpl: https://arbiscan.io/tx/{tx}
        addrExplorerTpl: https://arbiscan.io/address/{addr}

      - internalName: OPTIMISM_MAINNET
        displayName: Optimism
        nativeCurrency: ETH
        chainId: "10"
        type: evm
        avgCompletion: 2m
        txExplorerTpl: https://optimistic.etherscan.io/tx/{tx}
        addrExplorerTpl: https://optimistic.etherscan.io/address/{addr}

      - internalName: BASE_MAINNET
        displayName: Base
        nativeCurrency: ETH
        chainId: "8453"
        type: evm
        isFeatured: true
        avgCompletion: 2m
        txExplorerTpl: https://basescan.org/tx/{tx}
        addrExplorerTpl: https://basescan.org/address/{addr}

      - internalName: POLYGON_MAINNET
        displayName: Polygon
        nativeCurrency: MATIC
        chainId: "137"
        type: evm
        avgCompletion: 2m
        txExplorerTpl: https://polygonscan.com/tx/{tx}
        addrExplorerTpl: https://polygonscan.com/address/{addr}

      - internalName: BSC_MAINNET
        displayName: BNB Chain
        nativeCurrency: BNB
        chainId: "56"
        type: evm
        avgCompletion: 2m
        txExplorerTpl: https://bscscan.com/tx/{tx}
        addrExplorerTpl: https://bscscan.com/address/{addr}

      - internalName: AVAX_MAINNET
        displayName: Avalanche
        nativeCurrency: AVAX
        chainId: "43114"
        type: evm
        avgCompletion: 2m
        txExplorerTpl: https://snowtrace.io/tx/{tx}
        addrExplorerTpl: https://snowtrace.io/address/{addr}

      # Non-EVM mainnet — registry-visible with gating. BTC enabled
      # source-only (mpcd's mainnet keygen produces correct addresses;
      # the testnet re-encoder in internal/mchain/btc_address.go is
      # a no-op on mainnet input). Settlement on Bitcoin still requires
      # a BTC tx assembler + Schnorr signing in mpcd. SOL/TON both
      # disabled pending mpcd FROST Ed25519 keygen (§13.6 step 6).
      - internalName: BITCOIN_MAINNET
        displayName: Bitcoin
        nativeCurrency: BTC
        type: bitcoin
        avgCompletion: 1h
        txExplorerTpl: https://blockstream.info/tx/{tx}
        addrExplorerTpl: https://blockstream.info/address/{addr}

      - internalName: SOLANA_MAINNET
        displayName: Solana
        nativeCurrency: SOL
        type: solana
        avgCompletion: 1m
        txExplorerTpl: https://explorer.solana.com/tx/{tx}
        addrExplorerTpl: https://explorer.solana.com/address/{addr}

      - internalName: TON_MAINNET
        displayName: TON
        nativeCurrency: TON
        type: ton
        avgCompletion: 10m
        txExplorerTpl: https://tonscan.org/tx/{tx}
        addrExplorerTpl: https://tonscan.org/address/{addr}

      - internalName: XRP_MAINNET
        displayName: XRP
        nativeCurrency: XRP
        type: xrp
        avgCompletion: 30s
        txExplorerTpl: https://livenet.xrpl.org/transactions/{tx}
        addrExplorerTpl: https://livenet.xrpl.org/accounts/{addr}

    tokens:
      # LUX
      - asset: LUX
        name: Lux
        decimals: 18
        network: LUX_MAINNET

      # Ethereum mainnet — ETH + 3 major stablecoins
      - asset: ETH
        name: Ether
        decimals: 18
        network: ETHEREUM_MAINNET
      - asset: USDC
        name: USD Coin
        decimals: 6
        contract: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
        network: ETHEREUM_MAINNET
      - asset: USDT
        name: Tether USD
        decimals: 6
        contract: "0xdAC17F958D2ee523a2206206994597C13D831ec7"
        network: ETHEREUM_MAINNET
      - asset: DAI
        name: Dai Stablecoin
        decimals: 18
        contract: "0x6B175474E89094C44Da98b954EedeAC495271d0F"
        network: ETHEREUM_MAINNET

      # Arbitrum mainnet — Circle's canonical native USDC
      - asset: ETH
        name: Ether
        decimals: 18
        network: ARBITRUM_MAINNET
      - asset: USDC
        name: USD Coin
        decimals: 6
        contract: "0xaf88d065e77c8cC2239327C5EDb3A432268e5831"
        network: ARBITRUM_MAINNET

      # Optimism mainnet
      - asset: ETH
        name: Ether
        decimals: 18
        network: OPTIMISM_MAINNET
      - asset: USDC
        name: USD Coin
        decimals: 6
        contract: "0x0b2C639c533813f4Aa9D7837CAf62653d097Ff85"
        network: OPTIMISM_MAINNET

      # Base mainnet
      - asset: ETH
        name: Ether
        decimals: 18
        network: BASE_MAINNET
      - asset: USDC
        name: USD Coin
        decimals: 6
        contract: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
        network: BASE_MAINNET

      # Polygon mainnet — native is MATIC for registry consistency
      # (Polygon ecosystem rebranded to POL in late 2024; the ticker
      # change is not reflected here yet to match internal/tokens.go).
      - asset: MATIC
        name: Polygon
        decimals: 18
        network: POLYGON_MAINNET
      - asset: USDC
        name: USD Coin
        decimals: 6
        contract: "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359"
        network: POLYGON_MAINNET
      - asset: USDT
        name: Tether USD
        decimals: 6
        contract: "0xc2132D05D31c914a87C6611C10748AEb04B58e8F"
        network: POLYGON_MAINNET

      # BSC mainnet — USDC/USDT are 18 decimals here (BSC convention),
      # NOT 6 like other chains. Wrong decimals would credit users with
      # 10^12× the expected amount — sanity-check before adding any
      # other BSC tokens.
      - asset: BNB
        name: BNB
        decimals: 18
        network: BSC_MAINNET
      - asset: USDC
        name: USD Coin
        decimals: 18
        contract: "0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d"
        network: BSC_MAINNET
      - asset: USDT
        name: Tether USD
        decimals: 18
        contract: "0x55d398326f99059fF775485246999027B3197955"
        network: BSC_MAINNET

      # Avalanche mainnet
      - asset: AVAX
        name: Avalanche
        decimals: 18
        network: AVAX_MAINNET
      - asset: USDC
        name: USD Coin
        decimals: 6
        contract: "0xB97EF9Ef8734C71904D8002F8b6Bc66Dd9c48a6E"
        network: AVAX_MAINNET

      # Non-EVM mainnet — LUX go-live corridors (deposit + withdrawal).
      # ⚠️ PRECONDITION for SOL/TON/XRP: the ed25519 stack (mpcd-single +
      # mpc-router) must be live and release wallets funded + BALANCE-CAPPED
      # before serving this (single-signer custody; docs/operator-deploy-
      # ed25519.md). The bridge image must carry the G8 baseline gate
      # (de3a912a). BTC uses the always-present ECDSA cluster — no
      # precondition. Keep in sync with cmd/bridge/networks.mainnet.yaml.
      - asset: BTC
        name: Bitcoin
        decimals: 8
        network: BITCOIN_MAINNET
        isDepositEnabled: true
        isWithdrawalEnabled: true

      - asset: SOL
        name: Solana
        decimals: 9
        network: SOLANA_MAINNET
        isDepositEnabled: true
        isWithdrawalEnabled: true

      - asset: TON
        name: Toncoin
        decimals: 9
        network: TON_MAINNET
        isDepositEnabled: true
        isWithdrawalEnabled: true

      - asset: XRP
        name: XRP
        decimals: 6
        network: XRP_MAINNET
        isDepositEnabled: true
        isWithdrawalEnabled: true

    limits:
      minUSD: 10
      maxUSD: 100000
      per:
        USDT: {minUSD: 10, maxUSD: 100000}
        USDC: {minUSD: 10, maxUSD: 100000}
        DAI:  {minUSD: 10, maxUSD: 100000}
---
# PersistentVolumeClaim — the swap store (zapdb / Lux-flavored Badger v4)
# lives here. Single-writer: zapdb takes an exclusive directory lock,
# which is why the Deployment is pinned to replicas: 1 with Recreate.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lux-bridge-data
  namespace: lux-bridge
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lux-bridge
  namespace: lux-bridge
  labels:
    app: lux-bridge
    component: api
spec:
  # Single-writer: zapdb takes an exclusive dir lock. Scale-out
  # requires migrating swap state to a shared external store first.
  replicas: 1
  # Recreate (not RollingUpdate) — the new pod can't claim the PV
  # lock while the old pod still holds it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lux-bridge
  template:
    metadata:
      labels:
        app: lux-bridge
        component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bridge
          # Pinned to the verified go-live image (built from the local G8
          # branch, carries the source baseline gate). Do NOT deploy :latest
          # for go-live — it may resolve to a G8-less build. Bump this tag
          # for each release.
          image: ghcr.io/luxfi/bridge:de3a912a
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: BRIDGE_ADDR
              value: ":8080"
            - name: BRIDGE_CONFIG
              value: /etc/bridge/networks.yaml
            # Persistent swap store. The PVC mounted at this path
            # holds the zapdb files (memtable, vlog, sst). Removing
            # this env var falls back to the in-memory store —
            # restart loses state.
            - name: BRIDGE_DATA_DIR
              value: /var/lib/lux-bridge
            # Empty disables the legacy Node backend reverse proxy. All
            # /v1/bridge/* routes resolve through native handlers.
            - name: BRIDGE_BACKEND_URL
              value: ""
            # BridgeVM (b-chain) RPC. Leave unset until the BridgeVM is
            # available — the swap/quote routes still serve from native
            # state when bchain is offline.
            - name: BRIDGE_BCHAIN_URL
              value: ""
            # MPC keygen + signing daemon (mpcd) exposed by the StatefulSet
            # in mpc-deployment.yaml. The service forwards :8081 → :8080.
            - name: BRIDGE_MPC_URL
              value: http://mpc-api-svc.lux-bridge.svc:8081
            - name: BRIDGE_MPC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bridge-secrets
                  key: mpc-api-token
            - name: BRIDGE_MPC_ORG_ID
              value: bridge
            # Bridge security profile. classical-compat = user-facing UI to
            # external L1s. Pin strict-pq for internal Lux↔Lux only.
            - name: BRIDGE_PROFILE
              value: classical-compat
            # Live price feed (CoinGecko) wrapped over the static fallback.
            # REQUIRED for go-live: the static feed alone has no price for
            # XRP/AVAX/MATIC, so without this, XRP/AVAX/Polygon-native swaps
            # fail quote with "price_unknown" (caught in the Phase 0 testnet
            # rehearsal). The static feed still backstops CoinGecko outages
            # (it now carries those symbols too). For production request
            # volume set BRIDGE_COINGECKO_API_KEY (free tier is rate-limited)
            # — wire it through bridge-secrets like mpc-api-token.
            - name: BRIDGE_COINGECKO
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /etc/bridge
              readOnly: true
            - name: data
              mountPath: /var/lib/lux-bridge
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: lux-bridge-config
        - name: data
          persistentVolumeClaim:
            claimName: lux-bridge-data
        - name: tmp
          emptyDir:
            sizeLimit: 50Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lux-bridge
  namespace: lux-bridge
  labels:
    app: lux-bridge
spec:
  type: ClusterIP
  selector:
    app: lux-bridge
  ports:
    - port: 80
      targetPort: http
      name: http
---
# Ingress for the unified binary. Routes both the SPA (/) and the API
# (/v1/bridge/*) to the same Service — the binary serves both. Replaces
# the legacy split routing in mpc-deployment.yaml's bridge-ingress, which
# fanned /v1/ to opnet-watcher and / to bridge-ui.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lux-bridge
  namespace: lux-bridge
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: ingress
  tls:
    - hosts:
        - bridge.lux.network
        - bridge-api.lux.network
      secretName: lux-bridge-tls
  rules:
    - host: bridge.lux.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lux-bridge
                port:
                  number: 80
    - host: bridge-api.lux.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lux-bridge
                port:
                  number: 80
---
# NOTE: no HorizontalPodAutoscaler. The swap store is a single-writer
# embedded KV (zapdb with exclusive dir lock). Scaling beyond 1 pod
# requires migrating swap state to a shared external store first.
#
# NOTE: no PodDisruptionBudget. With replicas=1 a PDB would either
# block drains entirely (minAvailable=1) or be a no-op (minAvailable=0).
# Operators scale to 0 manually for planned maintenance.
