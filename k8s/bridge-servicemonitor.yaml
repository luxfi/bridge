---
# Tells Prometheus (k8s/monitoring-prometheus.yaml) to scrape the
# bridge's /metrics endpoint. Without this, everything documented in
# docs/operator-runbook.md §6 (Metrics) and the alert rules in
# k8s/bridge-alerts.yaml have no data to evaluate against — Prometheus
# only scrapes targets a ServiceMonitor (or PodMonitor) points it at.
#
# Targets the `lux-bridge` Service's "admin" port (k8s/bridge-deployment.yaml)
# — the operator listener, which is where cmd/bridge serves /metrics. The
# series name the MPC release wallets and say which of them cannot sign, so
# the port that carries them is not the port the Ingress publishes. Lives in
# the lux-bridge namespace, not monitoring:
# ServiceMonitors are picked up cluster-wide because
# serviceMonitorNamespaceSelector: {} on the Prometheus CR matches every
# namespace, so it can sit next to the thing it's monitoring.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lux-bridge
  namespace: lux-bridge
  labels:
    app: lux-bridge
    app.kubernetes.io/part-of: lux-monitoring
spec:
  selector:
    matchLabels:
      app: lux-bridge
  namespaceSelector:
    matchNames:
      - lux-bridge
  endpoints:
    - port: admin
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
