# Publish @luxfi/* packages to npm.
#
# Triggered by `v*` tag push. Publishes every public workspace package
# (anything with `"publishConfig.access": "public"` and not `"private": true`).
#
# Public:  @luxfi/bridge, @luxfi/core, @luxfi/threshold, @luxfi/utila
# Private (workspace-only, never published): @luxbridge/lux-tenant,
#                                            @luxbridge/explorer, @luxbridge/server,
#                                            @luxbridge/settings, @luxbridge/ui-automation
#
# The version baked into each package.json is the source of truth — the git
# tag is informational. Bump versions in PRs, tag once they merge to main.

name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Self-hosted org runner. GitHub-hosted runners are not authorised for
    # this org's billing plan.
    runs-on: lux-build
    steps:
      - uses: actions/checkout@v4
        with:
          # On tag push the checkout action already resolves the tag ref;
          # setting fetch-tags here on a self-hosted runner conflicts with
          # the refspec the runner uses, so we leave it implicit.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'
          scope: '@luxfi'

      - run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: Configure npm auth (npmjs.org)
        # Bake the token directly into the userconfig .npmrc — pnpm does
        # NOT expand ${VAR} references in .npmrc, so the literal token
        # has to be on disk. setup-node@v4 sets NPM_CONFIG_USERCONFIG to
        # a temp path; we write to that exact path so pnpm picks it up.
        run: |
          token="${NPM_TOKEN:-$NODE_AUTH_TOKEN}"
          if [ -z "$token" ]; then
            echo "::error::No NPM token available (NPM_TOKEN nor NODE_AUTH_TOKEN set)"
            exit 1
          fi
          target="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          cat > "$target" <<NPMRC
          registry=https://registry.npmjs.org/
          @luxfi:registry=https://registry.npmjs.org/
          //registry.npmjs.org/:_authToken=${token}
          always-auth=true
          NPMRC
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: pnpm install --frozen-lockfile || pnpm install

      # Build the publishable @luxfi/* packages that emit dist/.
      - name: Build @luxfi/core
        run: pnpm --filter @luxfi/core build

      - name: Build @luxfi/threshold
        run: pnpm --filter @luxfi/threshold build

      - name: Build @luxfi/utila
        run: pnpm --filter @luxfi/utila build

      # @luxfi/bridge ships source TS directly (no build step required for
      # consumers using a bundler like Vite/webpack/esbuild — type-only).
      - name: Typecheck @luxfi/bridge
        run: pnpm --filter @luxfi/bridge tc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publish via `pnpm publish -r` — pnpm walks the workspace, skips
      # `private: true` packages, and only ships those whose version isn't
      # already on the registry. `--no-git-checks` skips the dirty-tree
      # guard since the tag commit may include workflow edits.
      - name: Publish @luxfi/* to npmjs.org
        run: pnpm publish -r --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
