name: cmd-bridge image

# Publishes the single-binary Go bridge image built from cmd/bridge/Dockerfile —
# the tenant-config-capable server that white-label shims (e.g. zooai/bridge-shim)
# base their FROM on. The plain-semver image line (root Dockerfile) is the SPA;
# this all-in-one Go variant carries the `-server` suffix so the two never
# collide on a tag. Mirrors docker.yml (runs on the self-hosted `evo` runner —
# no GitHub-hosted minutes).

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/luxfi/bridge

jobs:
  build:
    runs-on: evo
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "t=${GITHUB_REF#refs/tags/}-server" >> "$GITHUB_OUTPUT"
          else
            echo "t=server" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/bridge/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.tag.outputs.t }}
            GH_TOKEN=${{ secrets.HANZOAI_READ_TOKEN }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.t }}
            ${{ env.IMAGE }}:server
