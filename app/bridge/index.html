<!doctype html>
<html lang="en" style="background-color: #0a0a0a">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The tab icon is the canonical Lux mark, @luxfi/logo@1.0.11
      getFaviconSVG, served from public/ as a real file. Both tags are
      written here rather than injected by the bundler because the
      elements have to exist in the static HTML: the Go server rewrites
      the href per tenant, and bridge.config.ts rewrites it again at
      runtime. The .ico is what a browser fetches on its own when it
      asks for /favicon.ico without reading the markup.
      Logo OTHER than the tab icon comes from @luxfi/logo at runtime.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <title>Lux Bridge</title>
    <meta name="description" content="Cross-chain bridge for the Lux Network." />
    <!--
      Runtime env: /__ENV.js sets window.__ENV before the main bundle
      loads. Serving image templates this file at boot from BRIDGE_*
      env vars; bridge.config.ts reads window.__ENV first, then falls
      back to Vite's import.meta.env. One image, N envs.

      Placed in <head> (and before the module script) so the synchronous
      parser-blocking load happens before any deferred module executes —
      the ordering is unambiguous regardless of how Vite reorganises
      the bundle.
    -->
    <script src="/__ENV.js"></script>
  </head>
  <body>
    <div id="bridge-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
