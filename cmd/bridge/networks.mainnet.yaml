  # 10^12× the expected amount — sanity-check before adding any
  # other BSC tokens.
  - asset: BNB
    name: BNB
    decimals: 18
    network: BSC_MAINNET
  - asset: USDC
    name: USD Coin
    decimals: 18
    contract: "0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d"
    network: BSC_MAINNET
  - asset: USDT
    name: Tether USD
    decimals: 18
    contract: "0x55d398326f99059fF775485246999027B3197955"
    network: BSC_MAINNET

  # Avalanche mainnet
  - asset: AVAX
    name: Avalanche
    decimals: 18
    network: AVAX_MAINNET
  - asset: USDC
    name: USD Coin
    decimals: 6
    contract: "0xB97EF9Ef8734C71904D8002F8b6Bc66Dd9c48a6E"
    network: AVAX_MAINNET

  # Non-EVM mainnet — LUX go-live corridors (deposit + withdrawal).
  #
  # ⚠️ PRECONDITION for SOL / TON / XRP: the ed25519 signing stack must be
  # live before this config is served — mpcd-single + mpc-router deployed
  # and the bridge's BRIDGE_MPC_URL pointed at the router — and each
  # release wallet funded AND BALANCE-CAPPED (single-signer custody; see
  # docs/operator-deploy-ed25519.md). Serving these enabled to a bridge
  # that lacks the ed25519 stack makes swaps to those chains stall at
  # signing with no signer. BTC uses the real ECDSA cluster (always
  # present) so it has no such precondition. The G8 source baseline gate
  # (in the de3a912a image) must be present for the SOL/TON/XRP deposit
  # side to be safe.
  - asset: BTC
    name: Bitcoin
    decimals: 8
    network: BITCOIN_MAINNET
    isDepositEnabled: true
    isWithdrawalEnabled: true

  - asset: SOL
    name: Solana
    decimals: 9
    network: SOLANA_MAINNET
    isDepositEnabled: true
    isWithdrawalEnabled: true

  - asset: TON
    name: Toncoin
    decimals: 9
    network: TON_MAINNET
    isDepositEnabled: true
    isWithdrawalEnabled: true

  - asset: XRP
    name: XRP
    decimals: 6
    network: XRP_MAINNET
    isDepositEnabled: true
    isWithdrawalEnabled: true

limits:
  minUSD: 10
  maxUSD: 100000
  per:
    USDT: {minUSD: 10, maxUSD: 100000}
    USDC: {minUSD: 10, maxUSD: 100000}
    DAI:  {minUSD: 10, maxUSD: 100000}
