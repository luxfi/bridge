# Mainnet networks config for cmd/bridge.
#
# Drop in: bridge --config cmd/bridge/networks.mainnet.yaml
#
# Mirror of the inline YAML in k8s/bridge-deployment.yaml's
# `lux-bridge-config` ConfigMap. The k8s Deployment mounts that ConfigMap
# at /etc/bridge/networks.yaml; compose.mainnet.yml mounts THIS file at
# the same path. Keep both in sync — they describe the same production
# chain set, just hosted differently per deploy strategy.

# Source of truth for the SPA + API's supported chains + tokens.
# Edit this ConfigMap and roll the deployment to add/remove networks
# without rebuilding the image.
#
# Internal names use the uppercase-with-underscore convention the
# bridge's internal lookup tables (internal/mchain,
# internal/depositcheck, internal/broadcast, internal/txassembler,
# internal/tokens) key off. Don't switch to lowercase-dashed — the
# chain wouldn't route.
brand:
  name: Lux Bridge
  title: Lux Bridge
  logoUrl: /logo.svg
  iconUrl: /icon.svg
  brandHost: bridge.lux.network

networks:
  - internalName: LUX_MAINNET
    displayName: Lux
    nativeCurrency: LUX
    chainId: "96369"
    type: evm
    isFeatured: true
    avgCompletion: 1m
    txExplorerTpl: https://explore.lux.network/tx/{tx}
    addrExplorerTpl: https://explore.lux.network/address/{addr}

  - internalName: ZOO_MAINNET
    displayName: Zoo
    nativeCurrency: ZOO
    chainId: "200200"
    type: evm
    isFeatured: true
    avgCompletion: 1m
    txExplorerTpl: https://explore.zoo.network/tx/{tx}
    addrExplorerTpl: https://explore.zoo.network/address/{addr}

  - internalName: ETHEREUM_MAINNET
    displayName: Ethereum
    nativeCurrency: ETH
    chainId: "1"
    type: evm
    isFeatured: true
    avgCompletion: 5m
    txExplorerTpl: https://etherscan.io/tx/{tx}
    addrExplorerTpl: https://etherscan.io/address/{addr}

  - internalName: ARBITRUM_MAINNET
    displayName: Arbitrum
    nativeCurrency: ETH
    chainId: "42161"
    type: evm
    avgCompletion: 2m
    txExplorerTpl: https://arbiscan.io/tx/{tx}
    addrExplorerTpl: https://arbiscan.io/address/{addr}

  - internalName: OPTIMISM_MAINNET
    displayName: Optimism
    nativeCurrency: ETH
    chainId: "10"
    type: evm
    avgCompletion: 2m
    txExplorerTpl: https://optimistic.etherscan.io/tx/{tx}
    addrExplorerTpl: https://optimistic.etherscan.io/address/{addr}

  - internalName: BASE_MAINNET
    displayName: Base
    nativeCurrency: ETH
    chainId: "8453"
    type: evm
    isFeatured: true
    avgCompletion: 2m
    txExplorerTpl: https://basescan.org/tx/{tx}
    addrExplorerTpl: https://basescan.org/address/{addr}

  - internalName: POLYGON_MAINNET
    displayName: Polygon
    nativeCurrency: MATIC
    chainId: "137"
    type: evm
    avgCompletion: 2m
    txExplorerTpl: https://polygonscan.com/tx/{tx}
    addrExplorerTpl: https://polygonscan.com/address/{addr}

  - internalName: BSC_MAINNET
    displayName: BNB Chain
    nativeCurrency: BNB
    chainId: "56"
    type: evm
    avgCompletion: 2m
    txExplorerTpl: https://bscscan.com/tx/{tx}
    addrExplorerTpl: https://bscscan.com/address/{addr}

  - internalName: AVAX_MAINNET
    displayName: Avalanche
    nativeCurrency: AVAX
    chainId: "43114"
    type: evm
    avgCompletion: 2m
    txExplorerTpl: https://snowtrace.io/tx/{tx}
    addrExplorerTpl: https://snowtrace.io/address/{addr}

  # Non-EVM mainnet — LUX go-live corridors. BTC bidirectional via the
  # real ECDSA cluster (P2WPKH/P2PKH need no Schnorr; tx assembler +
  # destination shipped). SOL/TON/XRP bidirectional via the ed25519 stack
  # (mpcd-single behind mpc-router) — see the token-level PRECONDITION
  # block below and docs/operator-deploy-ed25519.md.
  - internalName: BITCOIN_MAINNET
    displayName: Bitcoin
    nativeCurrency: BTC
    type: bitcoin
    avgCompletion: 1h
    txExplorerTpl: https://blockstream.info/tx/{tx}
    addrExplorerTpl: https://blockstream.info/address/{addr}

  - internalName: SOLANA_MAINNET
    displayName: Solana
    nativeCurrency: SOL
    type: solana
    avgCompletion: 1m
    txExplorerTpl: https://explorer.solana.com/tx/{tx}
    addrExplorerTpl: https://explorer.solana.com/address/{addr}

  - internalName: TON_MAINNET
    displayName: TON
    nativeCurrency: TON
    type: ton
    avgCompletion: 10m
    txExplorerTpl: https://tonscan.org/tx/{tx}
    addrExplorerTpl: https://tonscan.org/address/{addr}

  # XRP mainnet — go-live custody decided: mpcd-single (single-signer,
  # capped release balance) behind mpc-router, with the threshold-FROST
  # upgrade deferred to a later --eddsa-url flip. Token flags below are
  # enabled; the operator-side trigger is provisioning + capping the XRP
  # mainnet release wallet per docs/operator-deploy-ed25519.md.
  - internalName: XRP_MAINNET
    displayName: XRP
    nativeCurrency: XRP
    type: xrp
    avgCompletion: 30s
    txExplorerTpl: https://livenet.xrpl.org/transactions/{tx}
    addrExplorerTpl: https://livenet.xrpl.org/accounts/{addr}

