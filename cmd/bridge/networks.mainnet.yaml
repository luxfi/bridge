  # Reached by MPC custody rather than a teleporter contract. An empty
  # teleporter is a mode, not a gap: Ethereum and Polygon carry empty ones
  # too and cross fine, because the committee holds an address on the chain
  # and a deposit to it is the lock. Custody spans these already — CGGMP21
  # on secp256k1 for every EVM, FROST on Ed25519 for the substrate and
  # Cardano families — so what was missing here was the row, not the ability.

