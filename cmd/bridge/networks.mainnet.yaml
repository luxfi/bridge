  # CARDANO is deliberately absent. Its address type in the MPC wallet is
  # `sol` — the comment beside it says "placeholder" — and Cardano is not
  # Solana. Both are Ed25519 so the KEY is fine, but a Cardano address is
  # bech32 `addr1...` and a Solana one is a base58 public key. Offering it
  # would hand a user a Solana-shaped address to send ADA to, and the funds
  # would be gone. It goes in when it has an encoder, not before.

tokens:
  # The chains Lux runs — native coin only. Liquid tokens get added per
  # chain when the contract list firms up.
  - asset: LUX
    name: Lux
    decimals: 18
    network: LUX_MAINNET
  - asset: ZOO
    name: Zoo
    decimals: 18
    network: ZOO_MAINNET
  - asset: AI
    name: Hanzo
    decimals: 18
    network: HANZO_MAINNET
  - asset: PARS
    name: Pars
    decimals: 18
    network: PARS_MAINNET
  - asset: OSG
    name: Osage
    decimals: 18
    network: OSAGE_MAINNET

