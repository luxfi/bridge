  - asset: USDC
    name: USD Coin
    decimals: 6
    contract: "0x0b2C639c533813f4Aa9D7837CAf62653d097Ff85"
    network: OPTIMISM_MAINNET

  # Base mainnet
  - asset: ETH
    name: Ether
    decimals: 18
