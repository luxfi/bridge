# Mainnet networks config for cmd/bridge.
#
# Drop in: bridge --config cmd/bridge/networks.mainnet.yaml
#
# Mirror of the inline YAML in k8s/bridge-deployment.yaml's
# `lux-bridge-config` ConfigMap. The k8s Deployment mounts that ConfigMap
# at /etc/bridge/networks.yaml; compose.mainnet.yml mounts THIS file at
# the same path. Keep both in sync — they describe the same production
# chain set, just hosted differently per deploy strategy.

# Source of truth for the SPA + API's supported chains + tokens.
# Edit this ConfigMap and roll the deployment to add/remove networks
# without rebuilding the image.
#
# Internal names use the uppercase-with-underscore convention the
# bridge's internal lookup tables (internal/mchain,
# internal/depositcheck, internal/broadcast, internal/txassembler,
# internal/tokens) key off. Don't switch to lowercase-dashed — the
# chain wouldn't route.
brand:
  name: Lux Bridge
  title: Lux Bridge
  logoUrl: /logo.svg
  iconUrl: /icon.svg
  brandHost: bridge.lux.network

networks:
  - internalName: LUX_MAINNET
    displayName: Lux
    nativeCurrency: LUX
    chainId: "96369"
    type: evm
    isFeatured: true
    avgCompletion: 1m
    txExplorerTpl: https://explore.lux.network/tx/{tx}
    addrExplorerTpl: https://explore.lux.network/address/{addr}

  # The other chains Lux runs. Each is a sovereign L1 on its own primary
  # network, so its EVM chain id is the whole identity of the chain. Custody
  # is the same secp256k1 key at the same address it derives on Lux — a
  # crossing here needs no new key material, only liquidity on the far side.
  - internalName: ZOO_MAINNET
    displayName: Zoo
    nativeCurrency: ZOO
    chainId: "200200"
    type: evm
    avgCompletion: 1m
