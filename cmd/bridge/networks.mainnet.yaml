  # Non-EVM mainnet — registry-visible with gating. BTC enabled
  # source-only (mpcd's mainnet keygen produces correct addresses;
  # the testnet re-encoder in internal/mchain/btc_address.go is
  # a no-op on mainnet input). Settlement on Bitcoin still requires
  # a BTC tx assembler + Schnorr signing in mpcd. SOL/TON both
  # disabled pending mpcd FROST Ed25519 keygen (§13.6 step 6).
  - internalName: BITCOIN_MAINNET
    displayName: Bitcoin
    nativeCurrency: BTC
    type: bitcoin
    avgCompletion: 1h
    txExplorerTpl: https://blockstream.info/tx/{tx}
