    network: AVAX_MAINNET

  # Non-EVM mainnet — BTC source-only. SOL/TON both gated.
  - asset: BTC
    name: Bitcoin
    decimals: 8
    network: BITCOIN_MAINNET
    isDepositEnabled: true
    isWithdrawalEnabled: false

  - asset: SOL
    name: Solana
    decimals: 9
    network: SOLANA_MAINNET
    isDepositEnabled: false
    isWithdrawalEnabled: false

  - asset: TON
    name: Toncoin
    decimals: 9
    network: TON_MAINNET
    isDepositEnabled: false
    isWithdrawalEnabled: false

  # XRP settles on secp256k1 (same curve as the live ETH/BTC pipeline) — no
  # mpcd FROST/Ed25519 gap. Inbound detection via rippled account_info, last
  # validated ledger (internal/depositcheck).
  # The destination tag IS now plumbed end-to-end (API destination_tag ->
  # Swap.DestinationTag -> XRPSpec -> xrpl.PaymentUnsigned.DestinationTag) and
  # X-addresses are rejected at create time (xrpl.ValidateDestination) — same
  # code path as testnet. WITHDRAWAL STAYS GATED ON MAINNET: enable only after
  # a live testnet proof of the tag-carrying payout path (the code is safe but
  # never live-proven on a real ledger). Honest staged rollout — flip to true
  # once a testnet XRP withdrawal with a destination tag is confirmed on-chain.
  # A fresh per-swap deposit address must also hold the >= 10-XRP AccountRoot
  # base reserve, so the per-XRP minimum below stays above it.
  - asset: XRP
    name: XRP
    decimals: 6
    network: XRP_MAINNET
    isDepositEnabled: true
    isWithdrawalEnabled: false


  # The native asset of each network reached by custody. A network with no
  # asset row is in four of the five tables a crossing needs, and the fifth
  # is discovered after the user has sent funds.
  - asset: CELO
    name: Celo
    decimals: 18
    network: CELO_MAINNET
  - asset: ETH
    name: Ether
    decimals: 18
    network: ZORA_MAINNET
  - asset: ETH
    name: Ether
    decimals: 18
    network: BLAST_MAINNET
  - asset: ETH
    name: Ether
    decimals: 18
    network: LINEA_MAINNET
  - asset: XDAI
    name: xDAI
    decimals: 18
    network: GNOSIS_MAINNET
  - asset: FTM
    name: Fantom
    decimals: 18
    network: FANTOM_MAINNET
  - asset: ETH
    name: Ether
    decimals: 18
    network: AURORA_MAINNET
  - asset: DOT
    name: Polkadot
    decimals: 10
    network: POLKADOT_MAINNET

limits:
  minUSD: 10
  maxUSD: 100000
  per:
    USDT: {minUSD: 10, maxUSD: 100000}
    USDC: {minUSD: 10, maxUSD: 100000}
    DAI:  {minUSD: 10, maxUSD: 100000}
    # XRP per-swap deposit addresses must hold the >= 10-XRP AccountRoot base
    # reserve to exist on-ledger; a sub-reserve deposit never confirms. Keep the
    # minimum above the reserve (token-denominated minimum is the robust
    # follow-up; this USD floor is the interim proxy).
    XRP:  {minUSD: 30, maxUSD: 100000}
