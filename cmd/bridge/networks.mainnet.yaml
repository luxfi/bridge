  - asset: MATIC
    name: Polygon
    decimals: 18
    network: POLYGON_MAINNET
  - asset: USDC
    name: USD Coin
    decimals: 6
    contract: "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359"
    network: POLYGON_MAINNET
  - asset: USDT
    name: Tether USD
    decimals: 6
    contract: "0xc2132D05D31c914a87C6611C10748AEb04B58e8F"
    network: POLYGON_MAINNET

  # BSC mainnet — USDC/USDT are 18 decimals here (BSC convention),
  # NOT 6 like other chains. Wrong decimals would credit users with
  # 10^12× the expected amount — sanity-check before adding any
  # other BSC tokens.
  - asset: BNB
    name: BNB
    decimals: 18
    network: BSC_MAINNET
  - asset: USDC
    name: USD Coin
    decimals: 18
