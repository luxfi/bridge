  # Non-EVM tokens — registry-visible but deposit + withdrawal disabled
  # until both sides of the gap close (verified 2026-05-28):
  #   - BTC: mpcd returns an address but in mainnet P2PKH format (`1...`)
  #     even for BITCOIN_TESTNET. A user depositing testnet BTC would not
  #     be detected (wrong network) and one depositing mainnet BTC would
  #     lose funds. Needs either a mpcd testnet flag or a bridge-side
  #     re-encoder (hash160 → tb1...).
  #   - SOL: mpcd returns "no sol address returned from MPC keygen" —
  #     ed25519 / FROST keygen not yet wired in the cluster (§13.6 step 6).
  #   - TON: same as SOL — `mchain/client.go:590-594` notes TON shares
  #     the SOL keygen slot pending its own ed25519 derivation.
  # Once each gap closes (mpcd FROST + BTC testnet encoding), flip
  # isDepositEnabled back to true per token.
  # BTC source-only: deposit re-enabled 2026-05-28 once the bridge-side
  # mainnet→testnet address re-encoder landed (internal/mchain/btc_address.go).
  # mpcd still returns mainnet-format P2PKH; the bridge converts locally.
  # Withdrawal remains disabled — settlement on Bitcoin still requires
  # Schnorr signing in mpcd + a btc tx assembler (§13.6 step 6 / §13.7 G1).
  - asset: BTC
    name: Bitcoin
    decimals: 8
    network: BITCOIN_TESTNET
    isDepositEnabled: true
    isWithdrawalEnabled: false

  - asset: SOL
    name: Solana
    decimals: 9
    network: SOLANA_DEVNET
    isDepositEnabled: false
    isWithdrawalEnabled: false

  - asset: TON
    name: Toncoin
    decimals: 9
    network: TON_TESTNET
    isDepositEnabled: false
    isWithdrawalEnabled: false

  # XRP settles on secp256k1 — the SAME curve as the live ETH/BTC pipeline, so
  # it has no mpcd FROST/Ed25519 gap (unlike SOL/TON). Inbound detection
  # (rippled account_info, last validated ledger) is implemented in
  # internal/depositcheck; the r-address derives locally from the ecdsa_pub_key
  # mpcd already returns.
  # WITHDRAWAL ENABLED ON TESTNET: the destination tag is now plumbed
  # end-to-end (API destination_tag -> Swap.DestinationTag -> XRPSpec ->
  # xrpl.PaymentUnsigned.DestinationTag, signed into the SHA-512Half digest)
  # and X-addresses are rejected at swap-create time (xrpl.ValidateDestination),
  # so a tag-carrying payout to an exchange's pooled deposit address credits the
  # right sub-account instead of being lost (closes red finding c603f579/d26a0d0b).
  # A fresh per-swap deposit address must also hold the >= 10-XRP AccountRoot
  # base reserve, so the per-XRP minimum below stays above it.
  - asset: XRP
    name: XRP
    decimals: 6
    network: XRP_TESTNET
    isDepositEnabled: true
    isWithdrawalEnabled: true

limits:
  minUSD: 1
  maxUSD: 100000
  per:
    # XRP per-swap deposit addresses must hold the >= 10-XRP AccountRoot base
    # reserve to exist on-ledger; a sub-reserve deposit is rejected network-side
    # and never confirms. Keep the minimum above the reserve (a token-denominated
    # minimum is the robust follow-up; this USD floor is the interim proxy).
    XRP: {minUSD: 30, maxUSD: 100000}
