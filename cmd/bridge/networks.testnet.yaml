  # Non-EVM testnets — source-only. The bridge's internal/depositcheck
  # client polls native APIs for these (Blockstream for BTC, getBalance
  # for SOL, TON Center for TON). The destination side is not yet
  # implemented in internal/broadcast (returns ErrFamilyNotImplemented
  # per §13.7 G1) — until mpcd ships FROST Ed25519 (Solana) and
  # Schnorr (Bitcoin) and the txassembler gains non-EVM tx builders,
  # these chains can only be used as SOURCES of bridge swaps.
  # `is_withdrawal_enabled: false` on the native asset disables them
  # in the destination picker.
  - internalName: BITCOIN_TESTNET
    displayName: Bitcoin Testnet
    nativeCurrency: BTC
    type: bitcoin
    isTestnet: true
    avgCompletion: 30m
    txExplorerTpl: https://blockstream.info/testnet/tx/{tx}
    addrExplorerTpl: https://blockstream.info/testnet/address/{addr}

