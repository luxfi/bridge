# goreleaser config for the bridge Go binaries.
#
# Triggered by the release workflow on `v*` tag push (same tag that
# drives the npm publish of @luxfi/bridge — the Go and TS sides ship
# together). Builds native binaries for all six policy platforms.
#
# The Vite SPA + container images are built by .github/workflows/docker.yml
# (native multi-arch via hanzoai/.github reusable workflow).

version: 2

project_name: bridge

before:
  hooks:
    - go mod tidy

builds:
  - id: bridge
    main: ./cmd/bridge
    binary: bridge
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - id: opnet-watcher
    main: ./opnet-watcher
    binary: opnet-watcher
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: bridge
    builds: [bridge, opnet-watcher]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE*
      - README*

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc

release:
  draft: false
  prerelease: auto
  mode: append
